<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe4" />
    <script>
      (() => {
        const storageKey = "zuruzuru-ramen-map-theme";
        let theme;

        try {
          const storedTheme = localStorage.getItem(storageKey);
          if (storedTheme === "light" || storedTheme === "dark") theme = storedTheme;
        } catch {
          // Fall back to the browser preference when storage is unavailable.
        }

        theme ??= matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#161715" : "#f4efe4";
      })();
    </script>
    <meta
      name="description"
      content="SUSURU TV.で紹介されたラーメン店を地図とリストから探せる非公式ファンサイトのモックです。"
    />
    <title>ZURUZURU RAMEN MAP DELTA — 非公式ファンサイト</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
